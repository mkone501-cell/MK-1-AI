name: MK-1 プレビューサイトを公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v4
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 自動テスト
        run: npm test

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v4
      - name: 公開するファイルを準備
        run: |
          mkdir -p public
          cp index.html app.js styles.css public/
          touch public/.nojekyll
      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v5
      - name: 公開ファイルを登録
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: プレビューサイトを公開
        id: deployment
        uses: actions/deploy-pages@v4
